<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LojaCarro - Carros</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-wide">
        <div class="topbar">
            <h1>Carros cadastrados</h1>
            <div class="info">
                <span id="usuario-logado"></span>
                <span id="badge-role" class="badge"></span>
                &nbsp;
                <button class="btn-secondary btn-small" id="btn-logout">Sair</button>
            </div>
        </div>

        <div class="search-row">
            <input type="text" id="filtro-marca" placeholder="Filtrar por marca...">
            <button class="btn-secondary" id="btn-buscar">Buscar</button>
            <button class="btn-secondary" id="btn-limpar">Limpar</button>
        </div>

        <div id="area-gerente" style="display:none;">
            <h2 id="titulo-form">Cadastrar carro</h2>
            <form id="form-carro">
                <input type="hidden" id="carro-id">
                <div class="form-row">
                    <div>
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" required maxlength="255">
                    </div>
                    <div>
                        <label for="modelo">Modelo</label>
                        <input type="text" id="modelo" required maxlength="255">
                    </div>
                    <div>
                        <label for="ano">Ano</label>
                        <input type="number" id="ano" required min="1900" max="2100">
                    </div>
                    <div>
                        <button type="submit" class="btn-primary" id="btn-salvar-carro" style="margin-top:0;">Salvar</button>
                    </div>
                </div>
                <button type="button" class="btn-secondary btn-small" id="btn-cancelar-edicao" style="display:none;">Cancelar edição</button>
            </form>
        </div>

        <div id="mensagem"></div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th id="th-acoes" style="display:none;">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-carros"></tbody>
        </table>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/carros.js"></script>
</body>
</html>
