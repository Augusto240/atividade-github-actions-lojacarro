services:
  mysql:
    image: mysql:8.0
    container_name: lojacarro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: josecarro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: lojacarro-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: aluno
      RABBITMQ_DEFAULT_PASS: senha-local
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie lojacarro"
      RABBITMQ_CTL_ERL_ARGS: "-setcookie lojacarro"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  lojacarro-log:
    build: ../lojacarro-log
    container_name: lojacarro-log
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_SENHA: ${RABBITMQ_SENHA:-senha-local}
      ARQUIVO_OPERACOES: /app/dados/operacoes.log
    volumes:
      - ./logs/lojacarro-log:/app/dados
    restart: unless-stopped

  usuarios-api:
    build: ../lojacarro-usuarios-api
    container_name: usuarios-api
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/usuarios?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_SENHA: ${RABBITMQ_SENHA:-senha-local}
    ports:
      - "8081:8081"
    volumes:
      - ./logs/usuarios-api:/app/logs

  lojacarro-api:
    build: .
    container_name: lojacarro-api
    depends_on:
      mysql:
        condition: service_healthy
      usuarios-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER: dev
      BD_NAME: josecarro
      BD_USER: root
      BD_PASS: root
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/josecarro?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      USUARIOS_API_URL: http://usuarios-api:8081
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_SENHA: ${RABBITMQ_SENHA:-senha-local}
    ports:
      - "8080:8080"
    volumes:
      - ./logs/lojacarro:/app/logs

  frontend:
    build: ../lojacarro-frontend
    container_name: lojacarro-frontend
    depends_on:
      - lojacarro-api
      - usuarios-api
    ports:
      - "4200:80"
