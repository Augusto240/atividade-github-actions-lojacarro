services:
  mysql:
    image: mysql:8.0
    container_name: lojacarro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: josecarro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: lojacarro-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER: dev
      BD_NAME: josecarro
      BD_USER: root
      BD_PASS: root
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/josecarro?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs

  frontend:
    build: ./frontend
    container_name: lojacarro-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
