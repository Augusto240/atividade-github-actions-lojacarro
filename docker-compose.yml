services:
  mysql:
    image: mysql:8.0
    container_name: lojacarro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: josecarro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: lojacarro-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: josecarro
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: chave-secreta-lojacarro-para-desenvolvimento-com-mais-de-32-caracteres
    ports:
      - "8080:8080"

  frontend:
    image: nginx:alpine
    container_name: lojacarro-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    depends_on:
      - backend
